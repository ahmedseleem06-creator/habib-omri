name: Build X Deal Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          if [ -d "x_deal_marketing" ]; then
            cp -r x_deal_marketing/* www/
          else
            cp index.html logo.jpg manifest.json www/ 2>/dev/null || true
          fi

      - name: Build Android APK
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "X Deal Marketing" "com.xdeal.marketing" --web-dir www
          npx cap add android

          # حل تعارض مكتبات Kotlin وتخطي الفحص الزائد
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x checkDebugDuplicateClasses --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X-Deal-Marketing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
