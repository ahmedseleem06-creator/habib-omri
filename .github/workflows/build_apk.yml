name: Build Habib Omri APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Download & Extract Latest Verified Code
        run: |
          rm -rf app habib_omri *.zip 2>/dev/null || true
          echo "Downloading latest verified project package..."
          curl -sSL -H "User-Agent: Mozilla/5.0" -o clean_project.zip "https://files.catbox.moe/bps5kx.zip"
          unzip -o clean_project.zip

          if [ ! -d "./app" ]; then
            echo "ERROR: Directory ./app not found!"
            exit 1
          fi

      - name: Generate Official Android Platform Files
        working-directory: ./app
        run: |
          mkdir -p /tmp/custom_android
          cp android/app/src/main/AndroidManifest.xml /tmp/custom_android/
          cp android/app/build.gradle /tmp/custom_android/
          cp android/app/src/main/kotlin/com/example/habib_omri/MainActivity.kt /tmp/custom_android/

          flutter create --platforms=android --org com.example .
          flutter pub get

          cp /tmp/custom_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/custom_android/build.gradle android/app/build.gradle
          cp /tmp/custom_android/MainActivity.kt android/app/src/main/kotlin/com/example/habib_omri/MainActivity.kt

          rm -rf android/app/src/main/res/mipmap-anydpi-v26 2>/dev/null || true
          cp -rf assets/icons/res/* android/app/src/main/res/ 2>/dev/null || true
          chmod +x android/gradlew

      - name: Build APK (Release v3.3.1)
        working-directory: ./app
        run: |
          rm -f android/local.properties 2>/dev/null || true
          flutter build apk --release --no-tree-shake-icons --build-name=3.3.1 --build-number=9

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3alamona-El-Khas-Final-v3.3.1
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
