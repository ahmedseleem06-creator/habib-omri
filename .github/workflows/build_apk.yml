name: Build Habib Omri APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Download & Extract Latest Verified Code
        run: |
          # 1. Clean old folders and zips
          rm -rf app habib_omri *.zip 2>/dev/null || true

          # 2. Download the verified clean project archive directly
          echo "Downloading latest verified project package..."
          curl -sSL -H "User-Agent: Mozilla/5.0" -o clean_project.zip "https://files.catbox.moe/3iv8fz.zip"
          unzip -o clean_project.zip

          if [ ! -d "./app" ]; then
            echo "ERROR: Directory ./app not found!"
            exit 1
          fi

      - name: Generate Official Android Platform Files
        working-directory: ./app
        run: |
          flutter create --platforms=android --org com.example .
          flutter pub get

      - name: Fix Code & Configure Android
        working-directory: ./app
        run: |
          # 1. Clean const if any in widget trees
          sed -i 's/decoration: const BoxDecoration(/decoration: BoxDecoration(/g' lib/screens/stories_screen.dart || true
          sed -i 's/trailing: const Icon(/trailing: Icon(/g' lib/screens/stories_screen.dart || true
          sed -i 's/style: const TextStyle(/style: TextStyle(/g' lib/screens/stories_screen.dart || true
          sed -i 's/style: const TextStyle(/style: TextStyle(/g' lib/screens/love_hub_screen.dart || true
          sed -i 's/icon: const Icon(/icon: Icon(/g' lib/screens/love_hub_screen.dart || true

          # 2. Re-write AndroidManifest.xml cleanly (Prevents XML merge & parsing errors)
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.USE_BIOMETRIC" />
    <uses-permission android:name="android.permission.USE_FINGERPRINT" />
    <uses-permission android:name="android.permission.VIBRATE" />

    <application
        android:label="عالمنا الخاص"
        android:name="${applicationName}"
        android:icon="@mipmap/ic_launcher"
        android:roundIcon="@mipmap/ic_launcher_round">
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:launchMode="singleTop"
            android:theme="@style/LaunchTheme"
            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
            android:hardwareAccelerated="true"
            android:windowSoftInputMode="adjustResize">
            <meta-data
              android:name="io.flutter.embedding.android.NormalTheme"
              android:resource="@style/NormalTheme"
              />
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
        <meta-data
            android:name="flutterEmbedding"
            android:value="2" />
    </application>
</manifest>
EOF

          # 3. Setup MainActivity with FlutterFragmentActivity for biometrics
          cat << 'EOF' > android/app/src/main/kotlin/com/example/habib_omri/MainActivity.kt
package com.example.habib_omri

import io.flutter.embedding.android.FlutterFragmentActivity

class MainActivity: FlutterFragmentActivity() {
}
EOF

          # 4. Setup build.gradle cleanly with explicit v3.0.0 and debug signing
          cat << 'EOF' > android/app/build.gradle
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.habib_omri"
    compileSdk 34
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.habib_omri"
        minSdkVersion 21
        targetSdkVersion 34
        multiDexEnabled true
        versionCode 3
        versionName "3.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
EOF

          # 5. Apply Custom Romantic 3D App Icons
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 2>/dev/null || true
          cp -rf assets/icons/res/* android/app/src/main/res/ 2>/dev/null || true

          chmod +x android/gradlew

      - name: Build APK (Release v3.0.0)
        working-directory: ./app
        run: |
          rm -f android/local.properties 2>/dev/null || true
          flutter build apk --release --no-tree-shake-icons --build-name=3.0.0 --build-number=3

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3alamona-El-Khas-Final-v3
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
