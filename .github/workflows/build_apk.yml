name: Build Habib Omri APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Extract Zip & Normalize Directory Structure
        run: |
          for zipfile in *.zip; do
            if [ -f "$zipfile" ]; then
              echo "Extracting archive: $zipfile..."
              unzip -o "$zipfile"
            fi
          done

          for folder in Our_Private_World_New habib_omri app_source; do
            if [ -d "$folder" ]; then
              echo "Found wrapper folder: $folder. Flattening structure..."
              cp -r $folder/* . 2>/dev/null || true
              cp -r $folder/.* . 2>/dev/null || true
            fi
          done

          ls -la

          if [ ! -d "./app" ]; then
            echo "ERROR: Directory ./app not found!"
            exit 1
          fi

      - name: Generate Official Android Platform Files
        working-directory: ./app
        run: |
          flutter create --platforms=android --org com.example .
          flutter pub get

      - name: Fix Code & Configure Android
        working-directory: ./app
        run: |
          # 1. تصليح الألوان لثوابت ثابتة حتى لا يفشل الـ const أبداً
          sed -i 's/static Color get primary => current.primary;/static const Color primary = Color(0xFF9333EA);/g' lib/theme/app_theme.dart || true
          sed -i 's/static Color get primaryLight => current.primaryLight;/static const Color primaryLight = Color(0xFFC084FC);/g' lib/theme/app_theme.dart || true
          sed -i 's/static Color get background => current.background;/static const Color background = Color(0xFF0D0A14);/g' lib/theme/app_theme.dart || true
          sed -i 's/static Color get surface => current.surface;/static const Color surface = Color(0xFF171224);/g' lib/theme/app_theme.dart || true
          sed -i 's/static Color get surfaceElevated => current.surfaceElevated;/static const Color surfaceElevated = Color(0xFF221A33);/g' lib/theme/app_theme.dart || true
          sed -i 's/static Color get myBubbleStart => current.bubbleStart;/static const Color myBubbleStart = Color(0xFF7E22CE);/g' lib/theme/app_theme.dart || true
          sed -i 's/static Color get myBubbleEnd => current.bubbleEnd;/static const Color myBubbleEnd = Color(0xFF9333EA);/g' lib/theme/app_theme.dart || true
          sed -i 's/static Color get partnerBubble => current.partnerBubble;/static const Color partnerBubble = Color(0xFF211832);/g' lib/theme/app_theme.dart || true

          # 2. حذف كلمات const المسببة للخطأ في الشاشات
          sed -i 's/decoration: const BoxDecoration(/decoration: BoxDecoration(/g' lib/screens/stories_screen.dart || true
          sed -i 's/trailing: const Icon(/trailing: Icon(/g' lib/screens/stories_screen.dart || true
          sed -i 's/style: const TextStyle(/style: TextStyle(/g' lib/screens/stories_screen.dart || true
          sed -i 's/style: const TextStyle(/style: TextStyle(/g' lib/screens/love_hub_screen.dart || true
          sed -i 's/icon: const Icon(/icon: Icon(/g' lib/screens/love_hub_screen.dart || true
          sed -i 's/BorderSide.none/InputBorder.none/g' lib/screens/chat_screen.dart || true

          # 3. إعدادات الأندرويد والبصمة
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' android/app/src/main/kotlin/com/example/habib_omri/MainActivity.kt || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i '/minSdkVersion/a \        multiDexEnabled = true' android/app/build.gradle || true
          sed -i 's/android:label="[^"]*"/android:label="عالمنا الخاص"/g' android/app/src/main/AndroidManifest.xml || true
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" />' android/app/src/main/AndroidManifest.xml || true

          chmod +x android/gradlew

      - name: Build APK (Release)
        working-directory: ./app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3alamona-El-Khas-App
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
